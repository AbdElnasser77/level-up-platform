<main class="h-screen flex justify-center">
  <aside
    class="relative w-1/2 hidden h-screen lg:block text-white shadow-[10px_0_20px_rgba(0,0,0,0.15)] border-blue-500"
  >
    <div>
      <app-smokey-background />
      <div class="absolute h-full flex flex-col justify-evenly w-full p-10 bg-black/50">
        <div class="brand text-white flex">
          <span class="text-3xl font-semibold">
            LVL<span class="text-blue-500 font-bold">UP</span>
          </span>
          <svg lucideChevronsUp class="w-10 h-10 relative bottom-1 text-blue-500"></svg>
        </div>

        <div class="headline my-5">
          <h1 class="max-w-xl text-5xl font-bold leading-tight xl:text-5xl">
            Level<span class="text-blue-500"> UP </span>your learning journey with our smart Exam
            platform.
          </h1>
        </div>

        <div class="selling-points">
          <ul class="space-y-8">
            @for (feature of features; track $index) {
              <li class="flex gap-5">
                <span
                  class="mt-1 grid h-12 w-12 shrink-0 place-items-center rounded-xl border border-blue-300/50 text-blue-200"
                >
                  <svg [lucideIcon]="feature.img"></svg>
                </span>
                <div class="space-y-1.5">
                  <h2 class="font-mono text-lg font-bold text-blue-200">{{ feature.title }}</h2>
                  <p class="max-w-md font-mono text-sm leading-relaxed text-gray-300">
                    {{ feature.description }}
                  </p>
                </div>
              </li>
            }
          </ul>
        </div>
      </div>
    </div>
  </aside>
  <div
    class="page-wrapper w-full lg:w-1/2 p-5 text-center flex flex-col item-center justify-center"
  >
    <router-outlet></router-outlet>
  </div>
</main>
